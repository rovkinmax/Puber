schema_version = 3
minimum_kent_version = "2.5.0"
project_name = "Puber"
workflow_prefix = "Puber"
delivery_profile = "team"
platforms = ["android-tv"]
required_adapters = [
  "android_apk_install",
  "mcp_policy",
  "mobile_resource_lock",
  "mobile_evidence_audit",
]
kit_managed_adapters = [
  "android_apk_install",
  "mobile_resource_lock",
  "mobile_evidence_audit",
]
source_control = "github"
issue_tracker = "none"
release_topology = "tag-after-merged-release-pr"

[execution]
default_target = "ask-on-first-execution"

[execution.overrides]
canary = "head"
smoke-lab = "head"
maintenance = "default-branch"
release = "ask-on-first-execution"

[policies]
smoke = "conditional"
writer_sessions = "fresh_per_slice"
pr_merge_strategy = "auto"
branch_identity = "github_issue"

[capabilities]
managed_worktrees = true
pull_requests = true
ci_monitoring = true
standards_review = true
compliance_review = true
spec_review = true

[commands]
branch_identity = ".kent/scripts/workflow-branch-identity"
dispatch = ".kent/scripts/workflow-verification-dispatch"
verify = ".kent/scripts/workflow-verify-report"
checkpoint = ".kent/scripts/workflow-checkpoint"
evidence = ".kent/scripts/workflow-evidence-ledger"
plan_contract = ".kent/scripts/workflow-plan-contract"
plan_contract_accept = ".kent/scripts/workflow-plan-contract-accept"
plan_contract_continue = ".kent/scripts/workflow-plan-contract-continue"
plan_contract_verify = ".kent/scripts/workflow-plan-contract-verify"
plan_contract_fix_continue = ".kent/scripts/workflow-plan-contract-fix-continue"
wait_ci = ".kent/scripts/workflow-wait-github-ci"
wait_pr = ".kent/scripts/workflow-wait-github-pr"
janitor = ".kent/scripts/workflow-task-janitor"
smoke = ""

[context_manifests]
plan = ".kent/context/plan.md"
implement = ".kent/context/implement.md"
review = ".kent/context/review.md"
smoke = ".kent/context/smoke.md"
delivery = ".kent/context/delivery.md"

[procedures]
fix = ""
compliance = ".kent/commands/compliance-review.md"
smoke_decision = ".kent/commands/smoke-policy.md"
smoke = ".kent/commands/smoke-test.md"
ship = ".kent/commands/ship-pr.md"
ci = ""
waiting_pr = ""
cleanup = ".kent/commands/cleanup-task.md"

[work_kinds.feature]
description = "User-facing behavior, screens, flows, or business capabilities."
plan = ".kent/commands/feature-start.md"
implement = ".kent/commands/feature-implement.md"

[work_kinds.bugfix]
description = "Restore intended behavior for a reproducible defect."
plan = ".kent/commands/bugfix-start.md"
implement = ".kent/commands/bugfix-implement.md"

[work_kinds.refactor]
description = "Improve code structure without intended behavior changes."
plan = ".kent/commands/refactor-start.md"
implement = ".kent/commands/refactor-start.md"

[work_kinds.migration]
description = "Move contracts, frameworks, modules, or data in dependency order."
plan = ".kent/commands/migration-start.md"
implement = ".kent/commands/migration-start.md"

[work_kinds.dependency]
description = "Audit or update dependency versions and build-tool artifacts."
plan = ".kent/commands/dependency-update.md"
implement = ".kent/commands/dependency-update.md"

[work_kinds.test]
description = "Add or improve automated test coverage without product scope."
plan = ".kent/commands/test-coverage.md"
implement = ".kent/commands/test-coverage.md"

[adapters]
android_apk_install = ".kent/adapters/mobile/android-apk-install-preserve"
mcp_policy = ".kent/adapters/mcp/policy"
mobile_resource_lock = ".kent/adapters/mobile/emulator-resource-lock.sh"
mobile_evidence_audit = ".kent/adapters/mobile/mobile-evidence-audit.sh"

[roles]
orchestrator = "default"
plan_review = "spec-reviewer"
gate = "workflow-gate"
researcher = "project-researcher"
implementation = "implementation-worker"
fix = "fix-worker"
build_doctor = "build-doctor"
standards_review = "standards-reviewer"
spec_review = "spec-reviewer"
compliance = "compliance_reviewer"
qa = "runtime-smoke-tester"
release = "delivery-operator"
ci = "ci-monitor"
