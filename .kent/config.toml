[skills]
"puber-android-workflow" = true

[shell]
postprocessing_mode = "all"
postprocess_hook = "~/.kent/hooks/gradle-worktree-warning"

[worktrees]
# Applies to project-local/manual worktrees. Kent-managed task worktrees are owned under Kent's persistence root.
base_dir = ".kent/worktrees"
setup_script = ".kent/worktrees/setup.sh"

[workflow]
subagents = true

[subagents."android-codebase-analyst"]
model = "gpt-5.6-terra"
system_prompt_file = "subagents/android-codebase-analyst.md"
thinking_level = "medium"
model_verbosity = "low"

[subagents."android-codebase-analyst".tools]
patch = false

[subagents."android-researcher"]
model = "gpt-5.6-terra"
system_prompt_file = "subagents/android-codebase-analyst.md"
thinking_level = "medium"
model_verbosity = "low"

[subagents."android-researcher".tools]
patch = false

[subagents."project-researcher"]
model = "gpt-5.6-terra"
system_prompt_file = "subagents/android-codebase-analyst.md"
thinking_level = "medium"
model_verbosity = "low"
agent_callable = true
workflow_subagent = true

[subagents."project-researcher".tools]
patch = false

[subagents."gradle-build-doctor"]
model = "gpt-5.6-terra"
system_prompt_file = "subagents/gradle-build-doctor.md"
thinking_level = "medium"

[subagents."build-doctor"]
