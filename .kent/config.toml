[skills]
"puber-android-workflow" = true

[shell]
postprocessing_mode = "all"
postprocess_hook = "~/.kent/hooks/gradle-worktree-warning"

[worktrees]
# Applies to project-local/manual worktrees. Kent-managed task worktrees are owned under Kent's persistence root.
base_dir = ".kent/worktrees"
setup_script = ".kent/worktrees/setup.sh"

[workflow]
subagents = true

[subagents."researcher"]
system_prompt_file = "subagents/android-codebase-analyst.md"

[subagents."researcher".tools]
patch = false

[subagents."build-doctor"]
system_prompt_file = "subagents/gradle-build-doctor.md"

[subagents."implementation-worker"]
system_prompt_file = "subagents/implementation-worker.md"
agent_callable = true
workflow_subagent = true

[subagents."fix-worker"]
system_prompt_file = "subagents/fix-worker.md"
agent_callable = true
workflow_subagent = true

[subagents."ui-reviewer"]
system_prompt_file = "subagents/compose-reviewer.md"

[subagents."ui-reviewer".tools]
patch = false

[subagents."domain-reviewer"]
system_prompt_file = "subagents/domain-model-reviewer.md"

[subagents."domain-reviewer".tools]
patch = false

[subagents."quality-reviewer"]
system_prompt_file = "subagents/quality-reviewer.md"

[subagents."quality-reviewer".tools]
patch = false

[subagents."release-manager"]
system_prompt_file = "subagents/release-manager.md"
agent_callable = false
workflow_subagent = false

[subagents."release-manager".tools]
shell = true
patch = true
edit = false
