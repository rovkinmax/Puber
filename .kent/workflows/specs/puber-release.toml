# Revision 90 preparation is closed by the deterministic builder as
# prepare -> profile_generation -> finalize_release -> compliance. Its
# compliance_fix, ci_fix, and pr_fix transitions re-enter prepare with the
# complete release identity and prior proof carrier; old readiness remains
# stale until profile generation and finalization refresh the checkpoint.

