[[effect_jobs_v1.jobs.steps]]
kind = "run"
name = "Preflight production signing"
condition = ""
continue_on_error = false
uses = ""
with = {  }
run = "set -euo pipefail\ntest \"$PUBER_RELEASE_SIGNING_MODE\" = production\ntest -n \"$RELEASE_KEYSTORE_BASE64\"\ntest -n \"$STOREPASS\"\ntest -n \"$KEYALIAS\"\n# The key password is STOREPASS, never an independent input.\n"
effective_shell = ""
effective_working_directory = ""
effective_environment = { "PUBER_RELEASE_SIGNING_MODE" = "production", "RELEASE_KEYSTORE_BASE64" = "${{ secrets.RELEASE_KEYSTORE_BASE64 }}", "STOREPASS" = "${{ secrets.STOREPASS }}", "KEYALIAS" = "${{ secrets.KEYALIAS }}" }
secret_refs = ["KEYALIAS", "RELEASE_KEYSTORE_BASE64", "STOREPASS"]
validation_required = false
[[effect_jobs_v1.jobs.steps]]
kind = "run"
name = "Build and prepare production artifacts"
condition = ""
continue_on_error = false
uses = ""
with = {  }
run = "set -euo pipefail\ncleanup_signing() {\n  status=$?\n  trap - EXIT\n  rm -f app/release.jks app/keystore.properties\n  rm -rf app/build\n  if [ \"$status\" -ne 0 ]; then rm -rf release-artifacts; fi\n  exit \"$status\"\n}\ntrap cleanup_signing EXIT\ntrap 'exit 130' INT\ntrap 'exit 143' TERM\numask 077\ntest \"$PUBER_RELEASE_SIGNING_MODE\" = production\ntest -n \"$RELEASE_KEYSTORE_BASE64\"\ntest -n \"$STOREPASS\"\ntest -n \"$KEYALIAS\"\ntest ! -e app/keystore.properties && test ! -L app/keystore.properties\ntest ! -e app/release.jks && test ! -L app/release.jks\nprintf '%s' \"$RELEASE_KEYSTORE_BASE64\" | base64 --decode > app/release.jks\npin=3e0ddb2c5d39953d278f8cce813ff07a6b74059f1f9caa8fd752602e2bb8b61a\nalias_sha=\"$(keytool -exportcert -keystore app/release.jks -storepass:env STOREPASS -alias \"$KEYALIAS\" | sha256sum | cut -d ' ' -f 1)\"\ntest \"$alias_sha\" = \"$pin\"\n./gradlew --no-daemon :app:assembleProdRelease\nmapfile -t apks < <(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*.apk')\ntest \"${#apks[@]}\" -eq 1\napksigner=\"$(find \"$ANDROID_HOME/build-tools\" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)\"\ntest -x \"$apksigner\"\nproof=\"$(\"$apksigner\" verify --print-certs \"${apks[0]}\")\"\nsigner_sha=\"$(printf '%s\\n' \"$proof\" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')\"\ntest \"$signer_sha\" = \"$pin\"\nunset proof\nmkdir release-artifacts\ncp \"${apks[0]}\" \"release-artifacts/puber-${GITHUB_REF_NAME}.apk\"\n(cd release-artifacts && sha256sum \"puber-${GITHUB_REF_NAME}.apk\" > \"puber-${GITHUB_REF_NAME}.apk.sha256\")\n"
effective_shell = ""
effective_working_directory = ""
effective_environment = { "PUBER_RELEASE_SIGNING_MODE" = "production", "RELEASE_KEYSTORE_BASE64" = "${{ secrets.RELEASE_KEYSTORE_BASE64 }}", "STOREPASS" = "${{ secrets.STOREPASS }}", "KEYALIAS" = "${{ secrets.KEYALIAS }}" }
secret_refs = ["KEYALIAS", "RELEASE_KEYSTORE_BASE64", "STOREPASS"]
validation_required = false
